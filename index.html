<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galactic Vocabulary Archives - Mobile Ready</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&display=swap');

        body {
            background-color: #050505;
            background-image: radial-gradient(circle at center, #1a1a24 0%, #000000 100%);
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh; /* Changed from height: 100vh to allow mobile scrolling */
            overflow-x: hidden;
            overflow-y: auto; /* Allows scrolling on smaller screens */
            text-align: center;
        }

        .menu-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            width: 100%;
            max-width: 1300px;
            padding: 20px;
            box-sizing: border-box;
        }

        .main-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 52px;
            letter-spacing: 6px;
            color: #ffe81f;
            text-shadow: 0 0 15px rgba(255, 232, 31, 0.7);
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        /* EPIC ENTER BUTTON */
        #epic-enter-btn {
            background: transparent;
            border: none;
            font-family: 'Orbitron', sans-serif;
            font-size: 140px; 
            font-weight: 900;
            color: #000; 
            -webkit-text-stroke: 4px #ff0000; 
            text-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000, 0 0 60px #ff0000; 
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 15px;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        #epic-enter-btn:hover {
            transform: scale(1.05);
            text-shadow: 0 0 30px #ff0000, 0 0 50px #ff0000, 0 0 80px #ff0000;
        }
        
        /* Rank Colors */
        .color-1 { color: #ffa500; border-color: #ffa500; text-shadow: 0 0 8px #ffa500; }
        .color-2 { color: #00bfff; border-color: #00bfff; text-shadow: 0 0 8px #00bfff; }
        .color-3 { color: #ffffff; border-color: #ffffff; text-shadow: 0 0 8px #ffffff; }
        .color-4 { color: #bc13fe; border-color: #bc13fe; text-shadow: 0 0 8px #bc13fe; }
        .color-5 { color: #1e90ff; border-color: #1e90ff; text-shadow: 0 0 8px #1e90ff; }
        .color-6 { color: #ff0000; border-color: #ff0000; text-shadow: 0 0 8px #ff0000; }
        .color-7 { color: #ff69b4; border-color: #ff69b4; text-shadow: 0 0 8px #ff69b4; }
        .color-8 { color: #ffff00; border-color: #ffff00; text-shadow: 0 0 8px #ffff00; }
        .color-9 { color: #00ffff; border-color: #00ffff; text-shadow: 0 0 8px #00ffff; }
        .color-10 { color: #39ff14; border-color: #39ff14; text-shadow: 0 0 8px #39ff14; }

        #rank-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            justify-content: center;
            width: 100%;
        }

        .rank-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .rank-btn {
            background: rgba(0, 0, 0, 0.7);
            border-width: 4px;
            border-style: solid;
            border-radius: 15px;
            width: 100%;
            height: 160px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .rank-btn:hover { transform: scale(1.05); background: rgba(255, 255, 255, 0.05); }
        .btn-theme { font-size: 28px; font-weight: 900; display: block; margin-bottom: 5px; }
        .btn-character { font-size: 13px; font-weight: bold; opacity: 0.8; letter-spacing: 1px; }

        .progress-text { color: #666; font-size: 13px; font-family: monospace; }
        
        .nav-btn { 
            background: transparent; 
            border: 2px solid #555; 
            color: #888; 
            padding: 12px 35px; 
            font-size: 18px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.2s; 
            text-transform: uppercase; 
            border-radius: 5px; 
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 2px;
        }
        .nav-btn:hover { background: #444; color: #fff; }

        /* Video Screen Styles */
        #video-screen {
            display: none;
            position: relative;
            width: 100%;
            height: 100vh;
            background-color: #000;
        }

        #intro-video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .video-overlay-btn {
            position: absolute;
            bottom: 40px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid;
            padding: 15px 30px;
            font-size: 20px;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            border-radius: 8px;
            transition: all 0.2s;
            z-index: 10;
        }

        .btn-mute {
            left: 40px;
            color: #ff0000;
            border-color: #ff0000;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.4);
        }
        .btn-mute:hover { background: #ff0000; color: #fff; }

        .btn-skip {
            right: 40px;
            color: #00f3ff;
            border-color: #00f3ff;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.4);
        }
        .btn-skip:hover { background: #00f3ff; color: #fff; }

        /* Flashcard Area */
        #flashcard-area { display: none; width: 100%; height: 100vh; position: relative; }
        .hud { position: absolute; top: 20px; font-size: 22px; font-family: monospace; color: #444; }
        #progress-hud { left: 20px; text-align: left; }
        #score-hud { right: 20px; text-align: right; }
        .score-correct { color: #39ff14; }
        .score-failed { color: #ff0000; }

        #sentence-container {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .state-def { font-size: 3.8vw; color: #ff8c00; line-height: 1.3; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); } 
        .state-word { font-size: 7vw; color: #39ff14; text-transform: uppercase; letter-spacing: 4px; text-shadow: 0 0 20px rgba(57, 255, 20, 0.5); } 

        /* ON-SCREEN TOUCH CONTROLS */
        .touch-controls {
            position: absolute; 
            bottom: 20px; 
            width: 100%; 
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            padding: 0 10px;
            box-sizing: border-box;
        }
        .touch-btn {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #555;
            color: #fff;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: bold;
            font-family: 'Orbitron', sans-serif;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
        }
        .touch-btn:active { transform: scale(0.95); }

        /* --- MOBILE RESPONSIVE FIXES --- */
        @media (max-width: 800px) {
            .main-title { font-size: 32px; }
            #epic-enter-btn { 
                font-size: 60px; 
                -webkit-text-stroke: 2px #ff0000; 
                letter-spacing: 5px; 
            }
            #rank-grid { grid-template-columns: repeat(2, 1fr); }
            .rank-btn { height: 120px; }
            .btn-theme { font-size: 18px; }
            .hud { font-size: 16px; top: 10px; }
            .state-def { font-size: 6vw; }
            .state-word { font-size: 10vw; }
            
            .video-overlay-btn { font-size: 12px; padding: 10px 15px; bottom: 20px; }
            .btn-mute { left: 10px; }
            .btn-skip { right: 10px; }

            .touch-btn { padding: 10px 12px; font-size: 12px; }
        }
    </style>
</head>
<body>

    <div id="landing-screen" class="menu-container">
        <button id="epic-enter-btn" onclick="startVideoIntro()">ENTER</button>
    </div>

    <div id="video-screen">
        <video id="intro-video" src="https://raw.githubusercontent.com/dogierez/esential-vocabulary-star-wars-with-audio/main/intro.mp4" playsinline></video>
        <button id="mute-btn" class="video-overlay-btn btn-mute" onclick="toggleMute()">MUTE AUDIO</button>
        <button class="video-overlay-btn btn-skip" onclick="skipToMenu()">SKIP TO ARCHIVES &raquo;</button>
    </div>

    <div id="main-menu" class="menu-container" style="display: none;">
        <h1 class="main-title">Archives</h1>
        <div id="rank-grid"></div>
    </div>

    <div id="flashcard-area">
        <div id="progress-hud" class="hud">Module: <span id="hud-set" style="color: #888;"></span><br>Entry <span id="hud-current">0</span> / <span id="hud-total">0</span></div>
        <div id="score-hud" class="hud">Correct: <span id="hud-correct" class="score-correct">0</span><br>Failed: <span id="hud-failed" class="score-failed">0</span></div>
        
        <div id="sentence-container">
            <div id="def-text" class="state-def" style="visibility: hidden;"></div>
            <div id="word-text" class="state-word" style="visibility: hidden;"></div>
        </div>

        <div class="touch-controls">
            <button class="touch-btn" onclick="handleAction('listen')">🔊 Listen</button>
            <button class="touch-btn" onclick="handleAction('read')">📖 Read</button>
            <button class="touch-btn" onclick="handleAction('reveal')">👁️ Reveal</button>
            <button class="touch-btn" style="border-color: #ff0000; color: #ff0000;" onclick="handleAction('fail')">❌ Fail</button>
            <button class="touch-btn" style="border-color: #39ff14; color: #39ff14;" onclick="handleAction('pass')">✅ Correct</button>
            <button class="touch-btn" onclick="handleAction('undo')">↩️ Undo</button>
            <button class="touch-btn" style="border-color: #ffe81f; color: #ffe81f;" onclick="handleAction('exit')">Exit</button>
        </div>
    </div>

    <div id="results-screen" class="menu-container" style="display: none; justify-content: center;">
        <h1 style="font-size: 60px; color: #ffe81f; margin-bottom: 10px;">MISSION COMPLETE</h1>
        <div style="font-size: 72px; margin-bottom: 20px;">Score: <span id="res-percentage">0</span>%</div>
        <div style="font-size: 38px; margin-bottom: 40px;"><span class="score-correct">Correct: <span id="res-correct">0</span></span> | <span class="score-failed">Failed: <span id="res-failed">0</span></span></div>
        <button class="nav-btn" onclick="showMainMenu()">Return to Command Center</button>
    </div>

                { id: "087", def: "You go underground to take a train that moves under the streets. What is this system?", word: "Subway" },
                { id: "088", def: "You go to a big station where many large, comfortable buses arrive and leave. What is this place?", word: "Coach Station" },
                { id: "089", def: "You stay on the safe path for people next to a busy street. What is this part of the road?", word: "Sidewalk" },
                { id: "090", def: "You fly to one city, but you must stop there to change planes for your final destination. What is this flight?", word: "Connecting Flight" },
                { id: "091", def: "Your car breaks down on the highway. You move it to the side of the road to be safe. What is this lane?", word: "Safety Lane" },
                { id: "092", def: "Your suitcases are very heavy. The airline says you must pay extra money. What do we call these bags?", word: "Excess Luggage" },
                { id: "093", def: "You come to a place where two roads meet and cross each other like an \"X\". What is this place called?", word: "Crossroads" },
                { id: "094", def: "You go to a very small shop on the street to buy a newspaper or water. What is this shop?", word: "Kiosk" },
                { id: "095", def: "You are sitting on a train or a bus. You are not the driver. Who are you?", word: "Passenger" },
                { id: "096", def: "You arrive at the airport, but your bag is missing. You go to an office to report it. What is this office called?", word: "Lost Luggage Claim" }
            ],
            "religion": [
                { id: "097", def: "You do something that your faith says is bad or wrong. What is this action called?", word: "Sin" },
                { id: "098", def: "Many people believe that one day the world will come to an end. What is this day called?", word: "Doomsday" },
                { id: "099", def: "You close your eyes and talk to God to say thank you or ask for help. What is this action?", word: "Prayer" },
                { id: "100", def: "Something wonderful happens that is impossible according to science. What is this event?", word: "Miracle" },
                { id: "101", def: "People believe that when our bodies die, our souls continue to live in another place. What is this called?", word: "Afterlife" },
                { id: "102", def: "You go on a long journey to visit a holy city because of your faith. What is this journey?", word: "Pilgrimage" },
                { id: "103", def: "This person receives a special message from God and teaches other people. Who is this person?", word: "Prophet" },
                { id: "104", def: "You choose not to eat or drink from morning until evening for your faith. What is this action?", word: "Fasting" },
                { id: "105", def: "This is a system of beliefs about God with its own rules and holy book. What is this called?", word: "Religion" },
                { id: "106", def: "This is a holy being from heaven who has wings and protects people. What is this being?", word: "Angel" },
                { id: "107", def: "This person starts saying things that the leaders of their religion say are wrong. Who is this person?", word: "Heretic" },
                { id: "108", def: "Inside one big religion, there is a smaller group with different ideas. What is this group called?", word: "Sect" }
            ],
            "nature": [
                { id: "109", def: "During a storm, there is a bright flash of light and a loud noise from the sky. What is this called?", word: "Thunderbolt" },
                { id: "110", def: "You are on low land with high mountains on your left and right. What is this place called?", word: "Valley" },
                { id: "111", def: "Frozen balls of ice fall from the sky like rain. What is this called?", word: "Hail" },
                { id: "112", def: "There is no rain for a very long time and the ground is dry. What is this situation?", word: "Drought" },
                { id: "113", def: "It rains too much and the water covers the streets and houses. What is this called?", word: "Flood" },
                { id: "114", def: "This is a piece of land surrounded by water on three sides. What is this called?", word: "Peninsula" },
                { id: "115", def: "This is a very hot place with no water and only sand and rocks. What is this place?", word: "Desert" },
                { id: "116", def: "A huge amount of snow falls down a mountain very fast. What is this called?", word: "Avalanche" },
                { id: "117", def: "You find a large, natural hole in a mountain and you go inside. What is this place?", word: "Cave" },
                { id: "118", def: "This is a large part of the sea that is partly surrounded by land. What is this called?", word: "Gulf" },
                { id: "119", def: "The ground under your feet starts to shake and move very hard. What is this called?", word: "Earthquake" },
                { id: "120", def: "A large amount of rocks and earth suddenly falls down a hill. What is this called?", word: "Landslide" }
            ]
        };

        let currentRank = '', activeDeck = [], currentIndex = 0, isFlipped = false, scoreCorrect = 0, scoreFailed = 0, isActive = false, scoreHistory = [], isRevealed = false;
        let vocabAudio = null;
        let completedRanks = JSON.parse(localStorage.getItem('sw_cinematic_v3')) || [];

        const introVideo = document.getElementById('intro-video');

        function initMenu() {
            const grid = document.getElementById('rank-grid'); grid.innerHTML = '';
            ranks.forEach(rank => {
                const isDone = completedRanks.includes(rank.id), total = vocabularyData[rank.id].length;
                const container = document.createElement('div'); container.className = 'rank-container';
                const btn = document.createElement('button'); btn.className = `rank-btn ${rank.color}`;
                if(isDone) btn.style.opacity = "0.4";
                btn.innerHTML = `<span class="btn-theme">${rank.theme}</span><span class="btn-character">${rank.char}</span>`;
                btn.onclick = () => startTraining(rank);
                const prog = document.createElement('div'); prog.className = 'progress-text'; prog.innerText = isDone ? `CLEARED` : `${total} Entries`;
                container.appendChild(btn); container.appendChild(prog); grid.appendChild(container);
            });
        }

        // --- VIDEO CONTROLS ---
        function startVideoIntro() {
            document.getElementById('landing-screen').style.display = 'none';
            document.getElementById('video-screen').style.display = 'block';
            
            introVideo.muted = false;
            document.getElementById('mute-btn').innerText = "MUTE AUDIO";
            document.getElementById('mute-btn').style.borderColor = "#ff0000";
            document.getElementById('mute-btn').style.color = "#ff0000";

            introVideo.play().catch(e => {
                console.log("Video Autoplay blocked. Attempting muted autoplay fallback.", e);
                introVideo.muted = true;
                document.getElementById('mute-btn').innerText = "UNMUTE AUDIO";
                introVideo.play();
            });
        }

        function toggleMute() {
            const muteBtn = document.getElementById('mute-btn');
            if(introVideo.muted) {
                introVideo.muted = false;
                muteBtn.innerText = "MUTE AUDIO";
                muteBtn.style.color = "#ff0000";
                muteBtn.style.borderColor = "#ff0000";
            } else {
                introVideo.muted = true;
                muteBtn.innerText = "UNMUTE AUDIO";
                muteBtn.style.color = "#888";
                muteBtn.style.borderColor = "#888";
            }
        }

        function skipToMenu() {
            introVideo.pause();
            introVideo.currentTime = 0;
            document.getElementById('video-screen').style.display = 'none';
            showMainMenu();
        }

        introVideo.onended = function() {
            skipToMenu();
        };

        // --- FLASHCARD LOGIC ---
        function stopVocabAudio() {
            if (vocabAudio) {
                vocabAudio.pause();
                vocabAudio.currentTime = 0;
            }
        }

        function hideAll() { 
            ['landing-screen', 'video-screen', 'main-menu', 'flashcard-area', 'results-screen'].forEach(id => document.getElementById(id).style.display = 'none'); 
            stopVocabAudio(); 
        }

        function showMainMenu() { 
            hideAll(); 
            initMenu(); 
            document.getElementById('main-menu').style.display = 'flex'; 
            isActive = false; 
        }

        function startTraining(rankObj) {
            currentRank = rankObj; activeDeck = [...vocabularyData[rankObj.id]].sort(() => Math.random() - 0.5);
            currentIndex = 0; scoreCorrect = 0; scoreFailed = 0; scoreHistory = []; isActive = true;
            hideAll(); document.getElementById('flashcard-area').style.display = 'block';
            document.getElementById('hud-set').innerText = rankObj.theme;
            document.getElementById('hud-total').innerText = activeDeck.length;
            
            updateHUD(); 
            displayCard();
        }

        function updateHUD() {
            document.getElementById('hud-current').innerText = currentIndex + 1;
            document.getElementById('hud-correct').innerText = scoreCorrect;
            document.getElementById('hud-failed').innerText = scoreFailed;
        }

        function displayCard() {
            stopVocabAudio();
            const defEl = document.getElementById('def-text');
            defEl.innerText = activeDeck[currentIndex].def;
            defEl.style.visibility = "hidden"; 

            document.getElementById('word-text').innerText = activeDeck[currentIndex].word;
            document.getElementById('word-text').style.visibility = 'hidden';
            
            isFlipped = false;
        }

        function revealText() {
            document.getElementById('def-text').style.visibility = "visible";
        }

        function playAudioOnly() {
            stopVocabAudio();
            const item = activeDeck[currentIndex];
            const safeWord = item.word.replace(/ /g, '_'); 
            const categoryFolder = currentRank.id;
            
            const repoBaseUrl = 'https://raw.githubusercontent.com/dogierez/esential-vocabulary-star-wars-with-audio/main/audio';
            const audioUrl = `${repoBaseUrl}/${categoryFolder}/${item.id}_Q_${safeWord}.wav`;
            
            vocabAudio = new Audio(audioUrl);
            vocabAudio.play().catch(e => console.log(e));
        }

        function flipCard() { 
            if (!isFlipped) { 
                revealText(); 
                document.getElementById('word-text').style.visibility = 'visible'; 
                isFlipped = true; 
            } 
        }

        function nextCard() {
            currentIndex++;
            if (currentIndex >= activeDeck.length) {
                endExercise(`The Archives are complete.`);
            } else { 
                updateHUD(); 
                displayCard(); 
            }
        }

        function endExercise(msg) {
            isActive = false; hideAll();
            if (currentIndex >= activeDeck.length && !completedRanks.includes(currentRank.id)) {
                completedRanks.push(currentRank.id);
                localStorage.setItem('sw_cinematic_v3', JSON.stringify(completedRanks));
            }
            let total = scoreCorrect + scoreFailed;
            document.getElementById('results-screen').style.display = 'flex';
            document.getElementById('results-message').innerText = msg;
            document.getElementById('res-percentage').innerText = total === 0 ? 0 : Math.round((scoreCorrect / total) * 100);
            document.getElementById('res-correct').innerText = scoreCorrect;
            document.getElementById('res-failed').innerText = scoreFailed;
        }

        // --- NEW CENTRALIZED ACTION HANDLER (For Touch & Keyboard) ---
        function handleAction(actionType) {
            if (!isActive) return;

            if (actionType === 'listen') { 
                playAudioOnly(); 
            }
            else if (actionType === 'read') { 
                playAudioOnly();
                revealText(); 
            }
            else if (actionType === 'reveal') { 
                flipCard(); 
            }
            else if (actionType === 'pass' && isFlipped) { 
                scoreHistory.push('correct'); scoreCorrect++; nextCard(); 
            }
            else if (actionType === 'fail' && isFlipped) { 
                scoreHistory.push('failed'); scoreFailed++; nextCard(); 
            }
            else if (actionType === 'undo' && currentIndex > 0) {
                currentIndex--; const last = scoreHistory.pop();
                if (last === 'correct') scoreCorrect--; if (last === 'failed') scoreFailed--;
                updateHUD(); displayCard(); 
                revealText(); 
                document.getElementById('word-text').style.visibility = 'visible'; isFlipped = true;
            }
            else if (actionType === 'exit') {
                endExercise("Session Aborted");
            }
        }

        // GLOBAL KEYBOARD LOGIC (Mapping keys to the central handler)
        document.addEventListener('keydown', (e) => {
            if (!isActive) return;
            
            if (e.code === 'Enter') { e.preventDefault(); handleAction('listen'); }
            else if (e.code === 'Space') { e.preventDefault(); handleAction('read'); }
            else if (e.key === 'ArrowUp') handleAction('reveal');
            else if (e.key === 'ArrowRight') handleAction('pass');
            else if (e.key === 'ArrowLeft') handleAction('fail');
            else if (e.key === 'ArrowDown') handleAction('undo');
            else if (e.key === 'Escape') handleAction('exit');
        });

    </script>
</body>
</html>
